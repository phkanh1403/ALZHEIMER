[project]
name = "mci-dementia-risk"
version = "7.0.0"
description = "Dementia risk after mild cognitive impairment: ADNI pipeline, interval-censored models and clinical app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::mci_risk.model.ConvergenceWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "UP", "I", "RUF", "PL"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # intentional typographic characters in labels (−, ×, ·, ³)
    "PLR0913", "PLR0917",           # statistical functions take many explicit options
    "PLR2004",                      # domain constants (e.g. 0.5 for a tie) are clearer inline
    "C408",                         # dict(...) keyword style is used for result records
    "SIM300",                       # misfires on pandas columns named L and R (interval bounds)
]

[tool.ruff.lint.isort]
known-first-party = ["mci_risk"]
